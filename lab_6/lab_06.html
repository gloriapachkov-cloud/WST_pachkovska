<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <header class="mb-4 text-center">
            <h1 class="display-5 fw-bold text-primary">Магазин продуктів</h1>
        </header>

        <main class="row">
            <section class="col-md-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title h4 mb-3">Список товарів</h2>
                        <product-list></product-list>
                    </div>
                </div>
            </section>

            <section class="col-md-4">
                <div class="card shadow-sm border-success">
                    <div class="card-header text-bg-success">
                        <h2 class="h5 mb-0">Обране</h2>
                    </div>
                    <div class="card-body">
                        <favorites-list></favorites-list>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <div class="modal" tabindex="-1" id="productPopup" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="popupTitle">Деталі</h5>
                    <button type="button" class="btn-close btn-close-white" id="closePopup" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="popupDesc"></p>
                    <p class="fs-4 text-danger fw-bold" id="popupPrice"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
